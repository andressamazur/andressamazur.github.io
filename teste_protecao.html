<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Teste de proteção</title><style>body{font:16px/1.6 Arial;background:#f8f6f9;color:#34303a}main{max-width:700px;margin:40px auto;background:white;padding:25px;border-radius:14px}h1{color:#16003b}button{background:#a8175d;color:white;border:0;border-radius:30px;padding:13px 20px;font-size:16px}pre{white-space:pre-wrap}aside{border-left:5px solid #f73d93;padding:12px;background:#fff2f7}</style></head><body><main><h1>Teste de proteção</h1><aside>Teste técnico. Não informe dados pessoais. O teste não exibe registros existentes.</aside><p>Este teste tenta acessar o banco sem permissão de leitura e enviar uma mensagem fictícia sem validação.</p><button id="botao">Iniciar teste</button><pre id="resultado" role="status" aria-live="polite"></pre></main><script>
const base='https://culrwglxmtssjpurhvko.supabase.co',key='sb_publishable_95hlx1Z9zGciGKFHR1VvPw_-MWNF5B5';const out=document.getElementById('resultado');document.getElementById('botao').onclick=async function(){this.disabled=true;out.textContent='Executando testes...';let results=[];try{let r=await fetch(base+'/rest/v1/pre_atendimentos?select=id&limit=1',{headers:{apikey:key},cache:'no-store'});results.push(r.status===401||r.status===403?'Leitura sem autorização: BLOQUEADA ('+r.status+').':'Leitura sem autorização: VERIFICAR (código '+r.status+').');}catch{results.push('Leitura sem autorização: NÃO FOI POSSÍVEL CONCLUIR.')}try{let r=await fetch(base+'/functions/v1/superreceber-pre-atendimento-responder',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({token:'',respostas:{Nome:'Teste sem dados pessoais'}})});results.push(r.status===400||r.status===403?'Envio sem verificação: BLOQUEADO ('+r.status+').':'Envio sem verificação: VERIFICAR (código '+r.status+').')}catch{results.push('Envio sem verificação: NÃO FOI POSSÍVEL CONCLUIR.')}out.textContent=results.join('\n');this.disabled=false};</script></body></html>
