<!DOCTYPE html>
<html lang="pt-br">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<title>Andressa Mazur Advocacia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --rosa: #f73d93;
    --cinza-medio: #7f8487;
    --cinza-escuro: #413f42;
    --roxo-profundo: #16003b;
    --branco: #ffffff;
}

body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: var(--branco);
    color: var(--cinza-escuro);
}

header {
    background: linear-gradient(135deg, #16003b, #413f42);
    color: white;
    text-align: center;
    padding: 50px 20px;
}

header h1 {
    font-size: 2.4rem;
    font-weight: 600;
    margin: 10px 0;
}

header p {
    color: var(--rosa);
    font-weight: 500;
}

section {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
}

h2 {
    color: var(--roxo-profundo);
    font-weight: 600;
    border-left: 5px solid var(--rosa);
    padding-left: 12px;
    margin-bottom: 20px;
}

p {
    line-height: 1.7;
}

ul {
    padding-left: 20px;
}

ul li {
    margin-bottom: 8px;
}

.botao-whatsapp {
    display: inline-block;
    background: var(--rosa);
    color: white;
    padding: 14px 26px;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 600;
    transition: 0.3s;
}
